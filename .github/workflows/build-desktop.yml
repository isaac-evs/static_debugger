name: Build desktop app

# PyInstaller doesn't cross-compile, so macOS and Windows builds each run
# on that OS. Manually triggered (Actions tab -> Run workflow) rather than
# on every push, since these builds are slow and only needed when handing
# a new build to a non-technical user.
on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact-path: dist/AbinDebugger.app
            artifact-name: AbinDebugger-macOS
          - os: windows-latest
            artifact-path: dist/AbinDebugger
            artifact-name: AbinDebugger-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build with PyInstaller
        run: pyinstaller frontend/AbinDebugger.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
